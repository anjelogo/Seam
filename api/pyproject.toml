[project]
name = "seam-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "httpx",
    "python-dotenv",
    "perceptron>=0.4.0",
    "rembg[cpu]",
    "pillow",
    "seam-shared",
    "anthropic>=1.15.0",
    "argon2-cffi>=25.1.0",
    "curl-cffi>=0.16.3",
    "procrastinate>=3.10.0",
    "email-validator>=2.3.0",
]

[tool.uv.sources]
seam-shared = { workspace = true }
