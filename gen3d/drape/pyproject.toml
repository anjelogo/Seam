[project]
name = "seam-drape"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy<2",
    "scipy",
    "pillow",
    "trimesh",
    "pyyaml>=6.0",
    "python-dotenv",
    "anthropic",
    "psycopg[binary]",
    "psycopg-pool",
    "pydantic>=2",
    "httpx",
    "pygarment",
]

[project.optional-dependencies]
eval = ["lpips", "torch", "torchvision", "playwright"]
newton = ["newton==1.7.0"]

# PyPI pygarment 2.0.2 wheel is mispackaged; clone vendor/ before uv sync
[tool.uv.sources]
pygarment = { path = "vendor/GarmentCode", editable = true }

[tool.uv.workspace]
