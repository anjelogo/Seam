# docker compose -f docker/compose.yaml up --build
name: seam
services:
  seam:
    build: .
    command: bash /src/docker/start.sh
    environment:
      DATA_DIR: /data
    ports:
      - "5273:5273"
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ..:/src:ro
      - ../data:/data
      - uv-cache:/root/.cache/uv
      - npm-cache:/root/.npm

volumes:
  uv-cache:
  npm-cache:
