# dev:  make db (postgres + migrations) then make dev on the host, or docker compose --profile dev up --build
# prod: docker compose --profile prod up --build -d, or bash docker/ct-setup.sh in a Proxmox LXC
# Secrets and settings come from the repo-root .env; POSTGRES_PASSWORD is required.
name: seam

x-logs: &logs
  driver: json-file
  options: { max-size: 10m, max-file: "3" } # small CT disk, keep logs bounded

x-env: &env
  DATABASE_URL: postgresql://seam:${POSTGRES_PASSWORD:?}@postgres:5432/seam
  DATA_DIR: /data

x-backend: &backend
  build: { context: ., dockerfile: docker/backend.Dockerfile }
  image: seam-backend
  env_file: .env
  restart: unless-stopped
  init: true
  logging: *logs
  volumes:
    - ${DATA_PATH:-./data}:/data # baked glbs, thumbs and scraped images, shared by every service
    - u2net:/root/.u2net # rembg model cache, survives rebuilds
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: seam
      POSTGRES_DB: seam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    # compose can't scope ports to a profile on an always-on service; loopback only
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    # -h: the first-boot init server is socket-only, so this only passes once the real server listens
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "seam", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logs

  migrate:
    <<: *backend
    command: python -m seam_shared.migrate
    restart: "no"
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }

  dev:
    profiles: [dev]
    build: { context: docker, dockerfile: dev.Dockerfile }
    command: bash /src/docker/start.sh
    environment: *env
    ports:
      - "5273:5273"
      - "8000:8000"
      - "8001:8001"
    volumes:
      - .:/src:ro
      - ./data:/data
      - uv-cache:/root/.cache/uv
      - npm-cache:/root/.npm
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    <<: *backend
    profiles: [prod]
    working_dir: /app/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    environment:
      <<: *env
      GEN3D_URL: http://gen3d:8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  gen3d:
    <<: *backend
    profiles: [prod]
    working_dir: /app/gen3d
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --proxy-headers --forwarded-allow-ips=*
    environment:
      <<: *env
      ASSETS_DIR: /app/assets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  # one process only: the per-source rate limits live in memory
  worker:
    <<: *backend
    profiles: [prod]
    working_dir: /app/api
    command: python -m app.worker --queues scrape,default
    environment: *env

  worker-cv:
    <<: *backend
    profiles: [prod]
    working_dir: /app/api
    command: python -m app.worker --queues cv
    environment:
      <<: *env
      OMP_NUM_THREADS: "2"

  web:
    profiles: [prod]
    build: { context: ., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    ports:
      - "${WEB_PORT_HOST:-8080}:80"
    logging: *logs
    depends_on:
      api: { condition: service_healthy }
      gen3d: { condition: service_healthy }

  # Quick tunnel: random https://*.trycloudflare.com URL, no account needed.
  # For a fixed hostname, create a tunnel in the Cloudflare dashboard pointing at http://web:80,
  # put TUNNEL_TOKEN=... in .env and swap the command for: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
  tunnel:
    profiles: [prod]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:80
    depends_on: [web]
    logging: *logs

volumes:
  pgdata:
  u2net:
  uv-cache:
  npm-cache:
